name: Build Windows App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install React Native Web
        run: npm install react-native-web react-dom

      - name: Bridge React Native to Web
        run: |
          New-Item -ItemType Directory -Force -Path "node_modules/react-native"
          Set-Content -Path "node_modules/react-native/index.js" -Value "module.exports = require('react-native-web');"
          Set-Content -Path "node_modules/react-native/package.json" -Value '{"name": "react-native", "main": "index.js"}'

      - name: Build Clean React App
        env:
          CI: false
          GENERATE_SOURCEMAP: false
        run: npm run build

      - name: Build with Electron Builder
        run: npx electron-builder --win --publish never

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Executable-App
          path: release/*.exe
